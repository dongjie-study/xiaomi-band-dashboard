<style>

.content-topbar { display: flex; align-items: center; gap: 10px; padding: 14px 22px; background: #fff;

  url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%2394a3b8' d='M0 0h10L5 6z'/%3E%3C/svg%3E") no-repeat right 11px center;

.tm-kpi .k { font-size: .78em; color: #64748b; font-weight: 600; }

.tm-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.tm-chip { font-size: .78em; font-weight: 600; color: #475569; background: #f1f5f9; border: 1px solid transparent;
  border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: .15s; user-select: none; }
.tm-chip:hover { background: #e2e8f0; }
.tm-chip.on { background: rgba(255,105,0,.12); border-color: rgba(255,105,0,.45); color: #c2410c; }
.tm-chart { width: 100%; height: 300px; }
.tm-chart-lg { height: 340px; }
.tm-table-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; border: 1px solid #eef2f7; border-radius: 10px; }
table.tm-table { width: 100%; border-collapse: collapse; font-size: .82em; min-width: 1180px; }
table.tm-table th, table.tm-table td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid #f1f5f9; }
table.tm-table th { position: sticky; top: 0; background: #f8fafc; color: #475569; font-weight: 700; z-index: 2; }
table.tm-table th:first-child, table.tm-table td:first-child { text-align: left; position: sticky; left: 0; background: #fff; z-index: 1; }
table.tm-table th:first-child { background: #f8fafc; z-index: 3; }
table.tm-table tbody tr:hover td { background: #fff7ed; }
table.tm-table tbody tr.sel td { background: rgba(255,105,0,.10); font-weight: 700; }

.tm-loading, .tm-empty { text-align: center; color: #94a3b8; padding: 60px 10px; font-size: .92em; }
.tm-loading::before { content: ''; display: block; width: 26px; height: 26px; margin: 0 auto 12px;
  border: 3px solid #e2e8f0; border-top-color: var(--mi-orange, #ff6900); border-radius: 50%; animation: tmSpin .8s linear infinite; }
@keyframes tmSpin { to { transform: rotate(360deg); } }

body.tm-busy::after { content: ''; position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: 9999;
  background: linear-gradient(90deg, transparent, var(--mi-orange, #ff6900), transparent); animation: tmBusy 1.1s ease-in-out infinite; }
@keyframes tmBusy { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

<script>
/* ============ 终端流量分析 · 前端 ============ */
var INDEX = null, CURDAY = null, PREVDAY = null, DAY = null;
var CACHE = {}, CHARTS = {}, TREND_DAYS = [];
var HL = null;                                   /* 当前高亮的终端（聚焦） */
var SCOPES = [], CURSCOPE = '店铺整体';          /* 口径：账号级时只有「店铺整体」，逐间导出时会有多间 */
var CH = { pie: 'paid_amount', sell: 'paid_amount', bar: 'paid_amount', line: 'paid_amount', lineSell: '全部', share: 'paid_amount' };
var SHORT = { paid_amount: '支付金额', gmv: '成交金额', product_impressions: '商品曝光', product_clicks: '商品点击',
  paid_orders: '成交订单', paid_items: '成交件数', evr_click: '曝光→点击率', click_cvr: '点击→成交率',
  evr_order: '曝光→成交率', gpm_1k: '千次曝光支付', unit_price: '件单价', refund_rate: '退款率',
  hour_refund_rate: '1小时退款率', settle: '结算金额', settle_7d: '7日结算', settle_14d: '14日结算',
  presale: '预售定金', coupon: '优惠券金额', platform_subsidy: '平台补贴', talent_subsidy: '达人补贴',
  refund_amount: '退款金额', refund_orders: '退款订单', hour_refund_amount: '1小时退款金额',
  hour_refund_orders: '1小时退款订单', ship_paid: '发货支付', net_paid: '退款后支付' };
var TERM_COLOR = { '抖音': '#ff6900', '抖音极速版': '#f5a623', '抖音商城APP': '#4a90d9',
  '红果短剧': '#10b981', '豆包': '#8b5cf6', '其他': '#64748b' };
var FALLBACK = ['#ff6900','#f5a623','#4a90d9','#10b981','#8b5cf6','#ef4444','#14b8a6','#64748b'];
var CHIP_KEYS = ['paid_amount','gmv','product_impressions','product_clicks','paid_orders','paid_items',
  'evr_click','click_cvr','evr_order','gpm_1k','unit_price','refund_rate'];
var KPI_KEYS = ['paid_amount','gmv','product_impressions','product_clicks','paid_orders','paid_items','evr_click','click_cvr'];

/* ---------- 基础工具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtInt(v) { if (v == null) return '—'; return Math.round(v).toLocaleString('zh-CN'); }
function fmtMoney(v) {
  if (v == null) return '—';
  if (Math.abs(v) >= 100000000) return (v / 100000000).toFixed(2) + '亿';
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(1) + '万';
  if (Math.abs(v) >= 100) return Math.round(v).toLocaleString('zh-CN');
  return v.toFixed(2);
}
function fmtPct(v) { if (v == null) return '—'; return (v * 100).toFixed(2) + '%'; }
function fmtNum(v) { if (v == null) return '—'; return v.toFixed(2); }
function kindOf(key) {
  var m = (INDEX && INDEX.metrics || []).filter(function (x) { return x.key === key; })[0];
  return m ? m.kind : 'money';
}
function labelOf(key) {
  if (SHORT[key]) return SHORT[key];
  var m = (INDEX && INDEX.metrics || []).filter(function (x) { return x.key === key; })[0];
  return m ? m.label : key;
}
function fullLabelOf(key) {
  var m = (INDEX && INDEX.metrics || []).filter(function (x) { return x.key === key; })[0];
  return m ? m.label : key;
}
function fmtVal(key, v) {
  var k = kindOf(key);
  if (k === 'rate') return fmtPct(v);
  if (k === 'int') return fmtInt(v);
  if (k === 'perunit') return fmtNum(v);
  return fmtMoney(v);
}
function fmtRaw(key, v) {
  var k = kindOf(key);
  if (v == null) return '—';
  if (k === 'rate') return fmtPct(v);
  if (k === 'int') return fmtInt(v);
  if (k === 'perunit') return fmtNum(v);
  return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtAxis(key, v) {
  var k = kindOf(key);
  if (k === 'rate') return (v * 100).toFixed(1) + '%';
  if (k === 'int') return (Math.abs(v) >= 10000 ? (v / 10000).toFixed(0) + '万' : v);
  if (k === 'money') return (Math.abs(v) >= 10000 ? (v / 10000).toFixed(1) + '万' : v);
  return v;
}
function unitOf(key) {
  var k = kindOf(key);
  return k === 'rate' ? '%' : (k === 'int' ? '' : '元');
}
function getMonth(d) { return d ? String(d).substring(0, 7) : ''; }
function bust(url) { return url + '?_=' + String(Date.now()).substring(6); }

function fetchJson(url) {
  return fetch(bust(url), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error(url + ' ' + r.status);
    return r.json();
  });
}
function initChart(id) {
  var el = document.getElementById(id);
  if (!el) return null;
  if (CHARTS[id]) { CHARTS[id].dispose(); }
  CHARTS[id] = echarts.init(el);
  return CHARTS[id];
}
function busy(on) { document.body.classList.toggle('tm-busy', !!on); }

/* ---------- 数据访问 ---------- */
function scopeOf(day) {
  if (!day || !day.scopes) return null;
  return day.scopes[CURSCOPE] || day.scopes['店铺整体'] || day.scopes[Object.keys(day.scopes)[0]] || null;
}
function terms(day) {
  var s = scopeOf(day);
  if (!s || !s.terminals) return [];
  var order = (day.terminal_order || []).filter(function (t) { return t !== '整体'; });
  var have = Object.keys(s.terminals);
  return order.filter(function (t) { return have.indexOf(t) >= 0; });
}
function rec(day, term, sell) {
  var s = scopeOf(day);
  if (!s || !s.terminals || !s.terminals[term]) return null;
  return s.terminals[term][sell || '全部'] || null;
}
function val(day, term, sell, key) {
  var r = rec(day, term, sell);
  return r ? r[key] : null;
}
function total(day, key) { return val(day, '整体', '全部', key); }

/* ---------- 状态区 ---------- */
function renderStatus() {
  var el = document.getElementById('tmStatus');
  var prev = PREVDAY ? dayObj(PREVDAY) : null;
  var html = '<span class="ok">● 已同步</span>';
  html += '<span>数据日期 <b>' + esc(CURDAY) + '</b></span>';
  html += prev ? ('<span>对比基准 <b>' + esc(PREVDAY) + '</b></span>') : '<span>无对比基准（首日）</span>';
  var mode = (DAY && DAY.scope_mode === 'rooms') ? '逐直播间' : '账号级（全店）';
  html += '<span>口径 <b>' + esc(CURSCOPE) + '（' + mode + '）</b></span>';
  var n = DAY && DAY.source_n ? DAY.source_n : 0;
  html += '<span>' + (n > 1 ? ('来源 ' + n + ' 份文件，内容一致已去重') : ('来源 ' + n + ' 份文件')) + '</span>';
  el.innerHTML = html;
}

function renderHeadline() {
  var pay = total(DAY, 'paid_amount'), orders = total(DAY, 'paid_orders'), imp = total(DAY, 'product_impressions');
  var pv = PREVDAY ? (dayObj(PREVDAY) || {}) : null;
  var ppay = pv ? total(pv, 'paid_amount') : null;
  var dod = (ppay && ppay !== 0) ? ((pay / ppay - 1) * 100) : null;
  var t = '📱 ' + CURDAY + '　支付 ' + fmtMoney(pay) + ' 元';
  if (dod != null) t += '（前一日 ' + fmtMoney(ppay) + '，' + (dod >= 0 ? '+' : '') + dod.toFixed(1) + '%）';
  t += '　·　订单 ' + fmtInt(orders) + ' 单　·　商品曝光 ' + fmtInt(imp) + ' 次';
  document.getElementById('tmHeadline').textContent = t;
}

function deltaOf(key) {
  var prev = PREVDAY ? dayObj(PREVDAY) : null;
  var cur = total(DAY, key), p = prev ? total(prev, key) : null;
  if (cur == null || p == null || p === 0) return null;
  var k = kindOf(key);
  if (k === 'rate') return { text: (cur - p >= 0 ? '+' : '') + ((cur - p) * 100).toFixed(2) + 'pp', up: cur >= p };
  var d = (cur / p - 1) * 100;
  return { text: (d >= 0 ? '+' : '') + d.toFixed(1) + '%', up: d >= 0 };
}

function renderKpis() {
  var el = document.getElementById('tmKpi');
  var html = '';
  KPI_KEYS.forEach(function (key) {
    var v = total(DAY, key), d = deltaOf(key);
    var dHtml = d ? ('<div class="d">前一日 ' + fmtVal(key, total(PREVDAY ? dayObj(PREVDAY) : null, key)) +
      ' · <span class="' + (d.up ? 'up' : 'down') + '">' + esc(d.text) + '</span></div>')
      : '<div class="d">首日 / 无对比</div>';
    html += '<div class="tm-kpi"><div class="k">' + esc(labelOf(key)) + '</div>' +
      '<div class="v">' + fmtVal(key, v) + '</div>' + dHtml + '</div>';
  });
  el.innerHTML = html;
  document.getElementById('tmNote').textContent = (DAY && DAY.scope_mode === 'rooms')
    ? '口径：' + CURSCOPE + '（逐直播间导出），含该间直播 / 短视频 / 商品卡等全部成交渠道；与「流量分析」的直播间流量口径不可直接相加（终端构成含商品卡等成交）。'
    : '口径：平台「流量-终端构成」为账号级（全店）数据，含直播、短视频、商品卡等全部成交渠道，与「流量分析」的直播间口径不可直接相加或对比。';
}

/* ---------- 指标 chips ---------- */
function chipHtml(keys, cur, cbName) {
  return keys.map(function (k) {
    return '<span class="tm-chip' + (k === cur ? ' on' : '') + '" data-k="' + esc(k) + '" title="' + esc(fullLabelOf(k)) + '" onclick="' + cbName + '(\'' + esc(k) + '\')">' + esc(labelOf(k)) + '</span>';
  }).join('');
}
function renderChips() {
  document.getElementById('tmPieChips').innerHTML = chipHtml(CHIP_KEYS, CH.pie, 'setPie');
  document.getElementById('tmBarChips').innerHTML = chipHtml(CHIP_KEYS, CH.bar, 'setBar');
  document.getElementById('tmLineChips').innerHTML = chipHtml(CHIP_KEYS, CH.line, 'setLine');
  document.getElementById('tmShareChips').innerHTML = chipHtml(CHIP_KEYS, CH.share, 'setShare');
  document.getElementById('tmSellChips').innerHTML = chipHtml(['paid_amount','gmv','paid_orders'], CH.sell, 'setSell');
  renderLineTerms();
}

/* ---------- 折线图的「终端聚焦」chips + 口径 chips ---------- */
function renderLineTerms() {
  var el = document.getElementById('tmLineTerms');
  if (!el) return;
  var list = [null].concat(terms(DAY));
  el.innerHTML = list.map(function (t) {
    var on = (t == null) ? (HL == null) : (HL === t);
    var cb = (t == null) ? 'setHighlight(null)' : "setHighlight('" + esc(t) + "')";
    return '<span class="tm-chip' + (on ? ' on' : '') + '" onclick="' + cb + '">' + esc(t == null ? '全部终端' : t) + '</span>';
  }).join('');
}
function renderScopeChips() {
  var el = document.getElementById('tmScopeChips');
  if (!el) return;
  var names = (DAY && DAY.scopes) ? Object.keys(DAY.scopes) : [];
  if (names.length <= 1) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = names.map(function (n) {
    return '<span class="tm-chip' + (n === CURSCOPE ? ' on' : '') + '" onclick="setScope(\'' + esc(n) + '\')">' + esc(n) + '</span>';
  }).join('');
}
function setScope(n) { if (!n || n === CURSCOPE) return; CURSCOPE = n; HL = null; renderAll(); }

/* ---------- 图表 1：终端构成饼图 ---------- */
function renderPie() {
  var c = initChart('chartTmPie');
  if (!c) return;
  var key = CH.pie;
  var data = terms(DAY).map(function (t) {
    return { name: t, value: val(DAY, t, '全部', key) || 0,
      itemStyle: { color: TERM_COLOR[t] || FALLBACK[0] } };
  }).filter(function (d) { return d.value > 0; });
  document.getElementById('tmPieSub').textContent = labelOf(key) + ' · 共 ' + data.length + ' 类';
  c.setOption({
    tooltip: { trigger: 'item', formatter: function (p) {
      return esc(p.name) + '<br/>' + esc(labelOf(key)) + '：' + fmtVal(key, p.value) + '（' + p.percent + '%）';
    } },
    legend: { bottom: 0, itemWidth: 10, itemHeight: 10, textStyle: { color: '#475569', fontSize: 11 } },
    series: [{
      type: 'pie', radius: ['46%', '68%'], center: ['50%', '46%'], avoidLabelOverlap: true,
      itemStyle: { borderColor: '#fff', borderWidth: 2 },
      minAngle: 3,
      label: { fontSize: 11, color: '#475569', formatter: function (p) {
        return p.percent >= 3.5 ? (p.name + '\n' + p.percent + '%') : '';
      } },
      labelLine: { length: 8, length2: 8 },
      emphasis: { scale: true, scaleSize: 6, label: { fontSize: 12, fontWeight: 'bold' } },
      data: data
    }]
  }, true);
  c.off('click');
  c.on('click', function (p) { setHighlight(p.name === HL ? null : p.name); });
  c.resize();
}

/* ---------- 图表 2：售卖类型饼图 ---------- */
function renderSellPie() {
  var c = initChart('chartTmSell');
  if (!c) return;
  var key = CH.sell;
  var colors = { '自营': '#ff6900', '合作': '#4a90d9' };
  var data = ['自营', '合作'].map(function (s) {
    return { name: s, value: val(DAY, '整体', s, key) || 0, itemStyle: { color: colors[s] } };
  }).filter(function (d) { return d.value > 0; });
  var sum = data.reduce(function (a, b) { return a + b.value; }, 0);
  document.getElementById('tmSellSub').textContent = labelOf(key) + ' · 合计 ' + fmtVal(key, sum);
  c.setOption({
    tooltip: { trigger: 'item', formatter: function (p) {
      return esc(p.name) + '<br/>' + esc(labelOf(key)) + '：' + fmtVal(key, p.value) + '（' + p.percent + '%）';
    } },
    legend: { bottom: 0, itemWidth: 10, itemHeight: 10, textStyle: { color: '#475569', fontSize: 11 } },
    series: [{
      type: 'pie', radius: ['46%', '68%'], center: ['50%', '46%'],
      itemStyle: { borderColor: '#fff', borderWidth: 2 },
      label: { fontSize: 11, color: '#475569', formatter: function (p) {
        return p.name + '\n' + p.percent + '%';
      } },
      data: data
    }]
  }, true);
  c.off('click');
  c.on('click', function (p) { CH.lineSell = p.name; renderChips(); renderLine(); });
  c.resize();
}

/* ---------- 图表 3：终端 × 指标横向条形 ---------- */
function renderBar() {
  var c = initChart('chartTmBar');
  if (!c) return;
  var key = CH.bar;
  var list = terms(DAY).map(function (t) { return { t: t, v: val(DAY, t, '全部', key) || 0 }; })
    .sort(function (a, b) { return a.v - b.v; });
  document.getElementById('tmBarSub').textContent = labelOf(key) + ' · 当日 · 横向越长越大';
  c.setOption({
    grid: { left: 8, right: 70, top: 12, bottom: 8, containLabel: true },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: function (ps) {
      var p = ps[0];
      return esc(p.name) + '<br/>' + esc(labelOf(key)) + '：' + fmtVal(key, p.value);
    } },
    xAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } },
      axisLabel: { color: '#94a3b8', fontSize: 10, formatter: function (v) { return fmtAxis(key, v); } } },
    yAxis: { type: 'category', data: list.map(function (x) { return x.t; }),
      axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false },
      axisLabel: { color: '#475569', fontSize: 11, fontWeight: HL ? 600 : 400 } },
    series: [{
      type: 'bar', barMaxWidth: 22,
      data: list.map(function (x) {
        return { value: x.v, itemStyle: {
          color: (TERM_COLOR[x.t] || FALLBACK[0]),
          opacity: (HL && HL !== x.t) ? 0.25 : 1, borderRadius: [0, 4, 4, 0] } };
      }),
      label: { show: true, position: 'right', fontSize: 10, color: '#64748b',
        formatter: function (p) { return fmtVal(key, p.value); } }
    }]
  }, true);
  c.off('click');
  c.on('click', function (p) { setHighlight(p.name === HL ? null : p.name); });
  c.resize();
}

/* ---------- 图表 4：各终端指标逐日趋势（折线，支持单终端聚焦） ---------- */
function linePoints(name, key, sell, dates) {
  return dates.map(function (d) {
    var day = dayObj(d);
    return day ? val(day, name, sell, key) : null;
  });
}
function lineMetaText(name, key, sell, dates) {
  var vals = linePoints(name, key, sell, dates), pairs = [];
  vals.forEach(function (v, i) { if (v != null) pairs.push([dates[i], v]); });
  if (!pairs.length) return '该终端在这段时间没有数据。';
  var peak = pairs[0], sum = 0;
  pairs.forEach(function (p) { if (p[1] > peak[1]) peak = p; sum += p[1]; });
  var avg = sum / pairs.length;
  var first = pairs[0], last = pairs[pairs.length - 1], chg = '';
  if (kindOf(key) === 'rate') chg = (last[1] - first[1] >= 0 ? '+' : '') + ((last[1] - first[1]) * 100).toFixed(2) + 'pp';
  else if (first[1]) chg = (last[1] / first[1] - 1 >= 0 ? '+' : '') + ((last[1] / first[1] - 1) * 100).toFixed(1) + '%';
  return '峰值 <b>' + fmtVal(key, peak[1]) + '</b>（' + peak[0].substring(5) + '）· 日均 <b>' + fmtVal(key, avg) +
    '</b> · 首 ' + fmtVal(key, first[1]) + ' → 末 <b>' + fmtVal(key, last[1]) + '</b>' + (chg ? '（' + chg + '）' : '') +
    ' · ' + pairs.length + '/' + dates.length + ' 天有数据';
}
function renderLine() {
  var c = initChart('chartTmLine');
  if (!c) return;
  var key = CH.line, sell = CH.lineSell;
  var dates = TREND_DAYS;
  var focus = HL;
  var series;
  if (focus) {
    var fcolor = TERM_COLOR[focus] || FALLBACK[0];
    series = [{
      name: focus, type: 'line', smooth: 0.25, symbol: 'circle', symbolSize: 7,
      connectNulls: false, lineStyle: { width: 3.2, color: fcolor }, itemStyle: { color: fcolor },
      areaStyle: { color: fcolor, opacity: 0.10 }, emphasis: { focus: 'series' },
      markPoint: { symbolSize: 42, itemStyle: { color: fcolor }, label: { fontSize: 10, color: '#fff' },
        data: [{ type: 'max', name: '峰值' }, { type: 'min', name: '低点' }] },
      data: linePoints(focus, key, sell, dates)
    }, {
      name: '整体（该口径）', type: 'line', smooth: 0.25, symbol: 'circle', symbolSize: 4,
      connectNulls: false, lineStyle: { width: 1.8, type: 'dashed', color: '#94a3b8' },
      itemStyle: { color: '#94a3b8' },
      data: linePoints('整体', key, sell, dates)
    }];
  } else {
    series = terms(DAY).map(function (t, i) {
      var color = TERM_COLOR[t] || FALLBACK[i % FALLBACK.length];
      return {
        name: t, type: 'line', smooth: 0.25, symbol: 'circle', symbolSize: 5,
        connectNulls: false, lineStyle: { width: 2, color: color },
        itemStyle: { color: color },
        emphasis: { focus: 'series' },
        data: linePoints(t, key, sell, dates)
      };
    });
  }
  var sub = focus
    ? (focus + ' · ' + labelOf(key) + ' · 售卖类型「' + sell + '」· ' + dates[0].substring(5) + ' ~ ' + dates[dates.length - 1].substring(5) + ' · 共 ' + dates.length + ' 天')
    : (labelOf(key) + ' · 售卖类型「' + sell + '」· ' + dates.length + ' 天');
  document.getElementById('tmLineSub').textContent = sub;
  var metaEl = document.getElementById('tmLineMeta');
  if (metaEl) {
    metaEl.innerHTML = focus
      ? lineMetaText(focus, key, sell, dates) + '　·　再点一次「' + esc(focus) + '」取消聚焦'
      : '点上方终端 chip、饼图扇区、条形或明细表行 → 折线只显示该终端（叠加「整体」虚线对照），单独看它每天怎么变。';
  }
  c.setOption({
    grid: { left: 8, right: 20, top: 44, bottom: 8, containLabel: true },
    legend: { top: 6, itemWidth: 12, itemHeight: 8, textStyle: { color: '#475569', fontSize: 11 } },
    tooltip: { trigger: 'axis', formatter: function (ps) {
      var s = esc(ps[0].axisValue) + '<br/>';
      ps.forEach(function (p) {
        if (p.value == null) return;
        s += p.marker + esc(p.seriesName) + '：' + fmtVal(key, p.value) + '<br/>';
      });
      return s;
    } },
    xAxis: { type: 'category', boundaryGap: false, data: dates.map(function (d) { return d.substring(5); }),
      axisLine: { lineStyle: { color: '#e2e8f0' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
    yAxis: { type: 'value', scale: true, splitLine: { lineStyle: { color: '#f1f5f9' } },
      axisLabel: { color: '#94a3b8', fontSize: 10, formatter: function (v) { return fmtAxis(key, v); } } },
    series: series,
    toolbox: { right: 6, top: 0, iconStyle: { borderColor: '#94a3b8' }, feature: {
      saveAsImage: { title: '保存图片', name: '终端趋势_' + (HL ? HL + '_' : '') + key + '_' + CURDAY, pixelRatio: 2 } } }
  }, true);
  c.off('click');
  c.on('click', function (p) {
    var d = dates[p.dataIndex];
    if (d && d !== CURDAY) switchDay(d);
  });
  c.resize();
}

/* ---------- 图表 5：终端占比逐日趋势（100% 堆叠） ---------- */
function renderShare() {
  var c = initChart('chartTmShare');
  if (!c) return;
  var key = CH.share, dates = TREND_DAYS, list = terms(DAY);
  var totals = dates.map(function (d) {
    var day = dayObj(d);
    return day ? (total(day, key) || 0) : 0;
  });
  var series = list.map(function (t, i) {
    var color = TERM_COLOR[t] || FALLBACK[i % FALLBACK.length];
    return {
      name: t, type: 'line', stack: 's', smooth: 0.2, symbol: 'none',
      itemStyle: { color: color },
      areaStyle: { color: color, opacity: 0.55 }, lineStyle: { width: 0, color: color },
      emphasis: { focus: 'series' },
      data: dates.map(function (d, j) {
        var day = dayObj(d);
        if (!day) return null;
        var v = val(day, t, '全部', key);
        if (v == null || !totals[j]) return null;
        return +(v / totals[j] * 100).toFixed(2);
      })
    };
  });
  document.getElementById('tmShareSub').textContent = labelOf(key) + ' 占比 · ' + dates.length + ' 天';
  c.setOption({
    grid: { left: 8, right: 20, top: 40, bottom: 8, containLabel: true },
    legend: { top: 6, itemWidth: 12, itemHeight: 8, textStyle: { color: '#475569', fontSize: 11 } },
    tooltip: { trigger: 'axis', formatter: function (ps) {
      var s = esc(ps[0].axisValue) + '<br/>';
      ps.forEach(function (p) { if (p.value != null) s += p.marker + esc(p.seriesName) + '：' + p.value + '%<br/>'; });
      return s;
    } },
    xAxis: { type: 'category', boundaryGap: false, data: dates.map(function (d) { return d.substring(5); }),
      axisLine: { lineStyle: { color: '#e2e8f0' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
    yAxis: { type: 'value', max: 100, min: 0, axisLabel: { formatter: '{value}%', color: '#94a3b8', fontSize: 10 },
      splitLine: { lineStyle: { color: '#f1f5f9' } } },
    series: series
  }, true);
  c.resize();
}

/* ---------- 明细表 ---------- */
function renderTable() {
  var head = document.getElementById('tmTbody');
  var body = document.getElementById('tmTableBody');
  var keys = (INDEX.metrics || []).map(function (m) { return m.key; });
  var html = '<tr><th>终端</th><th>售卖类型</th>';
  keys.forEach(function (k) { html += '<th title="' + esc(fullLabelOf(k)) + '">' + esc(labelOf(k)) + '</th>'; });
  html += '</tr>';
  head.innerHTML = html;

  var rows = terms(DAY).concat(['整体']);
  var out = '';
  rows.forEach(function (t) {
    ['全部', '自营', '合作'].forEach(function (s, si) {
      var r = rec(DAY, t, s);
      if (!r) return;
      var cls = (t === '整体' ? 'total' : '') + (HL === t ? ' sel' : '');
      out += '<tr class="' + cls + '" data-t="' + esc(t) + '">';
      if (si === 0) {
        out += '<td rowspan="3" style="font-weight:700">' + esc(t) + '</td>';
      }
      out += '<td>' + esc(s) + '</td>';
      keys.forEach(function (k) { out += '<td>' + esc(fmtRaw(k, r[k])) + '</td>'; });
      out += '</tr>';
    });
  });
  body.innerHTML = out;
  document.getElementById('tmTableSub').textContent = (INDEX.metrics || []).length + ' 个口径 × ' + terms(DAY).length + ' 个终端';
  Array.prototype.forEach.call(body.querySelectorAll('tr'), function (tr) {
    tr.addEventListener('click', function () {
      var t = tr.getAttribute('data-t');
      if (t === '整体') return;
      setHighlight(t === HL ? null : t);
    });
  });
}

/* ---------- 高亮联动 ---------- */
function setHighlight(name) {
  HL = name;
  renderBar(); renderLine(); renderTable(); renderShare(); renderLineTerms();
  var pie = CHARTS['chartTmPie'], sell = CHARTS['chartTmSell'];
  if (pie) {
    pie.dispatchAction({ type: 'downplay', seriesIndex: 0 });
    if (name) pie.dispatchAction({ type: 'highlight', seriesIndex: 0, name: name });
  }
}

/* ---------- chips 回调 ---------- */
function setPie(k) { CH.pie = k; renderChips(); renderPie(); }
function setBar(k) { CH.bar = k; renderChips(); renderBar(); }
function setLine(k) { CH.line = k; renderChips(); renderLine(); }
function setShare(k) { CH.share = k; renderChips(); renderShare(); }
function setSell(k) { CH.sell = k; renderChips(); renderSellPie(); }

/* ---------- 多日数据 ---------- */
function dayObj(d) { return CACHE[d] || null; }
function loadDay(d) {
  if (CACHE[d]) return Promise.resolve(CACHE[d]);
  return fetchJson('./data/' + d.substring(0, 4) + '/' + d + '.json').then(function (j) {
    CACHE[d] = j;
    return j;
  });
}
function trendWindow() {
  var days = (INDEX.days || []).map(function (x) { return x.date; });
  var upto = days.filter(function (d) { return d <= CURDAY; });
  return upto.slice(-14);
}
function loadTrend() {
  var days = trendWindow();
  return Promise.all(days.map(function (d) { return loadDay(d).catch(function () { return null; }); }))
    .then(function () { TREND_DAYS = days; });
}

/* ---------- 渲染总控 ---------- */
function renderAll() {
  renderStatus(); renderHeadline(); renderKpis(); renderScopeChips(); renderChips();
  renderPie(); renderSellPie(); renderBar(); renderLine(); renderShare(); renderTable();
}
function showDay(d) {
  if (!INDEX) return Promise.resolve();
  d = d || CURDAY;
  var months = (INDEX.months || []).map(function (m) { return m.ym; });
  var ym = getMonth(d);
  if (months.indexOf(ym) < 0) ym = months[0];
  CH.pie = CH.pie || 'paid_amount';
  CURDAY = d;
  fillMonthSelect(ym);
  fillDaySelect(ym, d);
  var days = (INDEX.days || []).map(function (x) { return x.date; });
  var i = days.indexOf(d);
  PREVDAY = i > 0 ? days[i - 1] : null;
  busy(true);
  var need = [d];
  if (PREVDAY) need.push(PREVDAY);
  return loadTrend().then(function () {
    return Promise.all(need.map(function (x) { return loadDay(x).catch(function () { return null; }); }));
  }).then(function () {
    DAY = dayObj(d);
    if (!DAY) { noData(); return; }
    if (!DAY.scopes || !DAY.scopes[CURSCOPE]) CURSCOPE = (DAY.scopes && Object.keys(DAY.scopes)[0]) || '店铺整体';
    document.getElementById('tmContent').hidden = false;
    document.getElementById('tmEmpty').hidden = true;
    document.getElementById('tmLoading').hidden = true;
    renderAll();
    if (location.hash !== '#' + d) {
      try { history.replaceState(null, '', '#' + d); } catch (e) { location.hash = d; }
    }
  }).catch(function (e) {
    console.error(e);
    noData();
  }).then(function () { busy(false); });
}

function noData() {
  document.getElementById('tmLoading').hidden = true;
  document.getElementById('tmContent').hidden = true;
  document.getElementById('tmEmpty').hidden = false;
  document.getElementById('monthSelect').innerHTML = '<option>暂无数据</option>';
  document.getElementById('daySelect').innerHTML = '<option>暂无数据</option>';
  document.getElementById('monthSelect').disabled = true;
  document.getElementById('daySelect').disabled = true;
}

/* ---------- 下拉 ---------- */
function fillMonthSelect(ym) {
  var months = INDEX.months || [];
  var el = document.getElementById('monthSelect');
  el.innerHTML = months.map(function (m) {
    var lab = m.label + '（' + m.count + ' 天）';
    return '<option value="' + esc(m.ym) + '"' + (m.ym === ym ? ' selected' : '') + '>' + esc(lab) + '</option>';
  }).join('');
}
function fillDaySelect(ym, cur) {
  var m = (INDEX.months || []).filter(function (x) { return x.ym === ym; })[0];
  var dates = m ? m.dates.slice() : [];
  var prettyMap = {};
  (INDEX.days || []).forEach(function (d) { prettyMap[d.date] = d.pretty; });
  var el = document.getElementById('daySelect');
  el.innerHTML = dates.map(function (d) {
    var lab = (prettyMap[d] || d.substring(5)) + '（' + d.substring(5).replace('-', '/') + '）';
    return '<option value="' + esc(d) + '"' + (d === cur ? ' selected' : '') + '>' + esc(lab) + '</option>';
  }).join('');
}
function switchMonth(ym) {
  var m = (INDEX.months || []).filter(function (x) { return x.ym === ym; })[0];
  if (!m || !m.dates.length) return;
  showDay(m.dates[0]);
}
function switchDay(d) { if (d && d !== CURDAY) showDay(d); }

/* ---------- 初始化 ---------- */
function init() {
  fetchJson('./data/index.json').then(function (ix) {
    INDEX = ix;
    if (!ix.days || !ix.days.length) { noData(); return; }
    var hash = (location.hash || '').replace('#', '');
    var exists = (ix.days || []).some(function (x) { return x.date === hash; });
    var d = exists ? hash : ix.days[ix.days.length - 1].date;
    return showDay(d);
  }).catch(function (e) {
    console.error(e);
    noData();
  });
}

window.addEventListener('resize', function () {
  Object.keys(CHARTS).forEach(function (k) { if (CHARTS[k]) CHARTS[k].resize(); });
});
window.addEventListener('hashchange', function () {
  var d = (location.hash || '').replace('#', '');
  if (d && d !== CURDAY) showDay(d);
});
document.addEventListener('keydown', function (e) {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var days = (INDEX && INDEX.days || []).map(function (x) { return x.date; });
  var i = days.indexOf(CURDAY);
  if (i < 0) return;
  var j = e.key === 'ArrowLeft' ? i - 1 : i + 1;
  if (days[j]) { e.preventDefault(); showDay(days[j]); }
});
init();
</script>
