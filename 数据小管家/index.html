<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据小管家 · 问我就答</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--txt:#1a1d26;--sub:#6b7280;--blue:#1E90FF;--border:#e5e7eb;--mi:#FF6900}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100vh;max-height:100vh}
header{background:linear-gradient(135deg,#FF6900,#ff8f4d);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px}
header b{font-size:16px;font-weight:600}
header small{display:block;font-size:11px;opacity:.85;font-weight:400}
header .set{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin-bottom:12px;gap:8px}
.msg .av{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.ai .av{background:#fff3e6}
.msg.me{flex-direction:row-reverse}
.msg.me .av{background:var(--blue);color:#fff}
.bubble{max-width:82%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.ai .bubble{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
.msg.me .bubble{background:var(--blue);color:#fff;border-top-right-radius:4px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#bbb;margin-right:3px;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* —— AI 回答 Markdown 排版 —— */
.msg.ai .bubble.md{white-space:normal}
.bubble.md p{margin:4px 0}
.bubble.md h4{margin:10px 0 4px;font-size:14px;color:var(--mi)}
.bubble.md ul{margin:4px 0 4px 18px}
.bubble.md li{margin:2px 0}
.bubble.md blockquote{border-left:3px solid var(--mi);background:#fff8f3;padding:4px 10px;color:var(--sub);margin:6px 0;border-radius:0 6px 6px 0;font-size:13px}
.bubble.md table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%;max-width:560px}
.bubble.md th,.bubble.md td{border:1px solid var(--border);padding:5px 9px;text-align:left;white-space:nowrap}
.bubble.md th{background:#fff3e6;font-weight:600}
.bubble.md tr:nth-child(even) td{background:#fafbfc}
.bubble.md code{background:#f0f1f3;border-radius:4px;padding:1px 5px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 12px 8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;font-size:12px;color:var(--sub);cursor:pointer}
form{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);flex-shrink:0;align-items:flex-end}
input[type=text]{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;background:#fff;outline:none}
input[type=text]:focus{border-color:var(--blue)}
/* 大输入区：可多行自动长高 */
textarea{flex:1;border:1px solid var(--border);border-radius:14px;padding:16px 16px;font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;outline:none;resize:none;min-height:84px;max-height:220px}
textarea:focus{border-color:var(--blue)}
#send{min-height:84px;padding:0 24px;font-size:16px}
button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 18px;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.gate{position:fixed;inset:0;background:rgba(245,246,248,.98);display:flex;align-items:center;justify-content:center;z-index:9;padding:24px}
.gate[hidden]{display:none!important}
.gate .box{background:#fff;border-radius:16px;padding:26px 22px;width:100%;max-width:360px;text-align:center;border:1px solid var(--border)}
.gate h2{font-size:16px;margin-bottom:6px}
.gate p{font-size:12px;color:var(--sub);margin-bottom:16px;white-space:pre-line;text-align:left;line-height:1.7}
.gate code{background:#f0f1f3;border-radius:4px;padding:1px 5px;font-size:11px}
.gate input{width:100%;text-align:center;letter-spacing:3px}
.gate button{width:100%;margin-top:12px;padding:10px 0;border-radius:10px}
.gate .err{color:#e02424;font-size:12px;margin-top:8px;height:16px}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="box">
    <h2 id="gateTitle">请输入访问口令</h2>
    <p id="gateHint">数据小管家 · 仅限内部使用</p>
    <input type="text" id="codeInput" placeholder="口令" maxlength="20" autofocus>
    <button id="codeBtn">进入</button>
    <div class="err" id="codeErr"></div>
  </div>
</div>
<header><div class="logo">📊</div><div><b>数据小管家</b><small>直播间销量数据 · 大白话问，秒回答</small></div><button class="set" id="setBtn">设置</button></header>
<main id="list"></main>
<div class="chips" id="chips"></div>
<form id="f"><textarea id="q" rows="1" placeholder="如：9月24日手环直播间卖了多少台手环11？（Enter 发送，Shift+Enter 换行）" autocomplete="off"></textarea><button id="send">发送</button></form>
<script>
// ══════════ 配置区（换后端只改这一行） ══════════
// 线上后端：Cloudflare Worker + 自定义域名 data.xiaomi-exam.top（国内可直连，与考试系统共用域名）
// 备用地址：https://xiaomi-data-assistant.1714508423.workers.dev （workers.dev 在国内被墙）
// ⚠️ 代码里会自动拼 /api/chat 等路径，这里只填域名，【不要】带 /api 后缀
const API_BASE = 'https://data.xiaomi-exam.top';
// ═══════════════════════════════════════════════

const $=s=>document.querySelector(s);
// 存储保护：部分内嵌浏览器/隐私模式下 localStorage 会抛 SecurityError，不能让它炸掉整个脚本
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// 全局错误兜底：任何脚本错误直接显示在聊天区，不再静默失败
window.addEventListener('error',function(e){try{add('ai','⚠️ 页面脚本出错：'+(e.message||e.type)+'\n请截图发售后排查')}catch(_){}});
const list=$('#list'),chips=$('#chips');
const SUGGEST=['手环11首销月进度怎么样了？','9月24日我司整体卖了多少？','手环直播间最近7天走势','谁是这周销冠主播？','良米这周手环11卖了多少台？'];
let history_=[],busy=false,myCode=store.get('dg_code')||'';
let base=(API_BASE||store.get('dg_base')||'').replace(/\/+$/,'');

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
// —— 轻量 Markdown 渲染（表格/标题/列表/引用/加粗），输入已先经 esc 转义 ——
function mdInline(s){return s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function mdRender(src){
  const lines=src.split('\n');let out='',p=[],i=0;
  const flush=()=>{if(p.length){out+='<p>'+mdInline(p.join('<br>'))+'</p>';p=[]}};
  const isSep=l=>l.includes('-')&&/^[\s|:\-]+$/.test(l);
  const row=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|.*\|?\s*$/.test(l)&&l.includes('|')&&i+1<lines.length&&isSep(lines[i+1])){
      flush();
      let tb='<table><tr>'+row(l).map(h=>'<th>'+mdInline(h)+'</th>').join('')+'</tr>';i+=2;
      while(i<lines.length&&/^\s*\|/.test(lines[i])){tb+='<tr>'+row(lines[i]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>';i++}
      out+=tb+'</table>';continue;
    }
    const h=l.match(/^#{1,6}\s+(.*)/);
    if(h){flush();out+='<h4>'+mdInline(h[1])+'</h4>';i++;continue}
    if(/^(&gt;|>)\s?/.test(l)){flush();out+='<blockquote>'+mdInline(l.replace(/^(&gt;|>)\s?/,''))+'</blockquote>';i++;continue}
    if(/^[-*]\s+/.test(l)){
      flush();let ul='<ul>';
      while(i<lines.length&&/^[-*]\s+/.test(lines[i])){ul+='<li>'+mdInline(lines[i].replace(/^[-*]\s+/,''))+'</li>';i++}
      out+=ul+'</ul>';continue;
    }
    if(!l.trim()){flush();i++;continue}
    p.push(l);i++;
  }
  flush();
  return out;
}
function add(role,text,typing){
  const d=document.createElement('div');d.className='msg '+role;
  const body=typing?'<span class="typing"><i></i><i></i><i></i></span>':(role==='ai'?mdRender(esc(text)):esc(text));
  d.innerHTML='<div class="av">'+(role==='ai'?'管家':'我')+'</div><div class="bubble'+(role==='ai'&&!typing?' md':'')+'">'+body+'</div>';
  list.appendChild(d);list.scrollTop=list.scrollHeight;return d}
function chipsInit(){
  if(history_.length)return;
  SUGGEST.forEach(s=>{const c=document.createElement('div');c.className='chip';c.textContent=s;
    c.onclick=()=>{if(!busy)send(s)};chips.appendChild(c)})}

function showGate(title,hint,needInput){
  $('#gate').hidden=false;$('#gateTitle').textContent=title;$('#gateHint').innerHTML=hint;
  $('#codeInput').style.display=needInput?'':'none';$('#codeBtn').style.display=needInput?'':'none';
  if(needInput)$('#codeInput').focus()}

async function api(path,body){
  const r=await fetch(base+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,code:myCode})}:undefined);
  return {status:r.status,data:await r.json().catch(()=>({}))}}

async function send(text){
  if(busy)return;text=text||$('#q').value.trim();if(!text)return;
  busy=true;$('#send').disabled=true;$('#q').value='';$('#q').style.height='auto';chips.style.display='none';
  history_.push({role:'user',content:text});add('me',text);
  const typingEl=add('ai','',true);
  try{
    const {status,data}=await api('/api/chat',{messages:history_});
    typingEl.remove();
    if(status===403){history_.pop();showGate('口令不正确','请重新输入访问口令',true);return}
    if(data.error){add('ai','出错了：'+data.error)}
    else{history_.push({role:'assistant',content:data.answer});add('ai',data.answer)}
  }catch(e){typingEl.remove();add('ai','网络异常，稍后再试：'+e.message)}
  busy=false;$('#send').disabled=false}

$('#f').onsubmit=e=>{e.preventDefault();send()};
// 输入区：自动长高 + Enter 发送 / Shift+Enter 换行
$('#q').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,220)+'px'});
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#codeBtn').onclick=async()=>{
  const v=$('#codeInput').value.trim();if(!v)return;
  $('#codeBtn').disabled=true;$('#codeBtn').textContent='连接中…';
  $('#codeErr').textContent='';
  myCode=v;
  try{
    const {status}=await api('/api/chat',{messages:[{role:'user',content:'你好'}]});
    if(status===403){$('#codeErr').textContent='口令不正确';return}
    if(status!==200){$('#codeErr').textContent='后端异常（HTTP '+status+'），点右上角「设置」检查地址';return}
    store.set('dg_code',v);$('#gate').hidden=true;
  }catch(e){
    $('#codeErr').innerHTML='连接不上后端（网络问题或地址不对）。<br>点右上角「设置」检查地址（只填域名，不带 /api）。';
  }finally{
    $('#codeBtn').disabled=false;$('#codeBtn').textContent='进入';
  }};
$('#codeInput').onkeydown=e=>{if(e.key==='Enter')$('#codeBtn').click()};
$('#setBtn').onclick=()=>{
  const v=prompt('小管家后端地址（wrangler deploy 得到的网址）：',base);
  if(v!==null){base=v.trim().replace(/\/+$/,'');store.set('dg_base',base);location.reload()}};

async function init(){
  if(!base){
    showGate('小管家还没接上后端',
      '本页面需要一个已部署的小管家后端（API key 不能放在公开页面里）。\n\n部署只需 3 条命令：\n'
      +'1. cd assistant-server\n2. npx wrangler login\n3. npx wrangler secret put DEEPSEEK_API_KEY\n4. npx wrangler deploy\n\n'
      +'部署完点右上角「设置」，把得到的网址填进来即可。',false);
  }
  add('ai','你好，我是数据小管家 📊\n我可以查：每日销量、各直播间/商品/团队数据、小时出单高峰、主播业绩、手环11 首销月进度。\n直接用大白话问就行。');
  chipsInit();
  if(base){
    try{
      const {data}=await api('/api/config');
      if(data.enabled&&!myCode)showGate('请输入访问口令','数据小管家 · 仅限内部使用',true);
    }catch(e){}
  }
}
init();
</script>
</body>
</html>
